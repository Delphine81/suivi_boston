<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#1f2933;--mute:#5d6b78;--line:#d5dde5;--acc:#4a6b8a;--accT:#fff;--tan:#b98443;--soft:#e2eaf1;--ok:#3f7d6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161c22;--card:#212a33;--ink:#e8edf2;--mute:#9aa8b5;--line:#33404c;--acc:#7fa3c5;--accT:#10171d;--tan:#d6a15e;--soft:#2a3541;--ok:#6fc0a8}}
:root[data-theme="dark"]{--bg:#161c22;--card:#212a33;--ink:#e8edf2;--mute:#9aa8b5;--line:#33404c;--acc:#7fa3c5;--accT:#10171d;--tan:#d6a15e;--soft:#2a3541;--ok:#6fc0a8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{overflow-x:hidden;max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:520px;margin:0 auto;padding:8px 14px 40px;overflow-x:hidden}
.row .t,.ap,.ln,.step .t,.opt,textarea,input,.dim,.chp{word-break:break-word;overflow-wrap:anywhere}
table{table-layout:fixed;max-width:100%}
h1{font-size:19px;font-weight:800;margin:2px 0 8px}
h2{font-size:15px;font-weight:800;margin:14px 0 6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.gear{font-size:12px;font-weight:700;color:var(--acc);cursor:pointer;white-space:nowrap}
.hdrbtns{display:flex;gap:10px;align-items:center}
.addmore{display:block;width:100%;margin:14px 0;padding:10px 12px;border:1.5px dashed var(--acc);border-radius:14px;background:none;color:var(--acc);font:700 14px Nunito,system-ui,sans-serif;text-align:center;cursor:pointer}
.who,.tabs{display:flex;gap:8px;margin-bottom:8px}
.who span{font-size:14px;color:var(--mute);align-self:center}
.chip,.tab{flex:1;min-width:0;word-break:break-word;overflow-wrap:anywhere;text-align:center;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 6px;font:700 13.5px Nunito,system-ui,sans-serif;cursor:pointer}
.chip{flex:0 0 auto;padding:6px 14px;font-size:14px}
.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{display:flex;flex-direction:row;gap:8px;align-items:center;text-align:left;min-height:0;padding:10px 12px;border:0;border-radius:16px 16px 16px 6px;background:var(--card);color:var(--ink);font:800 15px Nunito,system-ui,sans-serif;box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer}
.big .e{font-size:22px;line-height:1}
.big .tx{display:flex;flex-direction:column;gap:0}
.big small{font:500 13px Nunito,system-ui,sans-serif;color:var(--mute)}
.big.live{background:var(--tan);color:#fff;box-shadow:none}.big.live small{color:#fff}
.row{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border-radius:12px;margin-bottom:6px}
.row.ev-row{cursor:pointer}
.row .e{font-size:22px;flex-shrink:0}.row .t{flex:1;min-width:0}.row .h{color:var(--mute);font-size:13px}
.x{border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;padding:4px 8px}
.empty{color:var(--mute);padding:8px 2px}
.dim{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border-radius:12px;margin-bottom:6px}
.dim .m{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--soft);color:var(--mute)}
.dim.done .m{background:var(--ok);color:var(--accT)}
.dim .t{flex:1;min-width:0}.dim small{display:block;color:var(--mute);font-size:13px}
.ap{padding:10px 12px;background:var(--card);border-radius:12px;margin-bottom:6px}
.ap small{display:block;color:var(--mute);font-size:13px}
.note{color:var(--mute);font-size:13px;margin-top:18px}
.sh{position:fixed;inset:0;background:rgba(10,15,20,.5);display:none;align-items:flex-end;z-index:9}
.sh.open{display:flex}
.sc{width:100%;max-width:520px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.sc h2{margin:0 0 12px;font-size:18px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:700 16px Nunito,system-ui,sans-serif;text-align:left;cursor:pointer}
#afst.opts{grid-template-columns:1fr 1fr;gap:6px}
#afst .opt{padding:8px 10px;font-size:14px;gap:6px}
.opt .e{font-size:22px}
.go{background:var(--acc);color:var(--accT);border-color:var(--acc);justify-content:center}
.ghost{background:none;border:0;color:var(--mute);padding:12px;width:100%;font:700 15px Nunito,system-ui,sans-serif;cursor:pointer}
input[type=number]{width:100%;padding:14px;font:800 24px Nunito,system-ui,sans-serif;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);margin-bottom:10px}
input[type=text],textarea{width:100%;padding:12px;font:600 15px Nunito,system-ui,sans-serif;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);margin-bottom:4px;resize:vertical}
textarea{margin-bottom:10px}
.ln{display:flex;justify-content:space-between;gap:8px;align-items:center}
.dots{display:flex;gap:4px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--soft);border:1.5px solid var(--line)}.dots i.y{background:var(--ok);border-color:var(--ok)}
.tb{margin-top:8px;border-top:1px solid var(--line);padding-top:6px;font-size:14px;color:var(--mute)}.tb .ln{padding:2px 0}
.warn{padding:10px 12px;background:var(--card);border-left:5px solid var(--tan);border-radius:8px;margin-top:12px;font-weight:700}
input.dmin{font-size:22px;font-weight:800;padding:12px 14px;background:var(--soft);border:1.5px solid var(--acc);color:var(--acc);text-align:center;margin:0}
.dmrow{display:flex;gap:8px;margin:4px 0 14px}
.dmrow .dmin{flex:1;min-width:0}
.dmrow .dtmin{flex:1;min-width:0;padding:10px 6px;font-size:13px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:center;padding:6px 4px;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}th{font-weight:800}
.opt small{display:block;font-weight:500;color:var(--mute);font-size:13px}
.chipsgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:0 0 12px}
.chp{display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 2px;font:700 10.5px Nunito,system-ui,sans-serif;cursor:pointer}
.chp .e{font-size:16px}
.chp.on,.opt.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.fchip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 10px;font:700 12px Nunito,system-ui,sans-serif;cursor:pointer}
.fchip.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
small.lb{display:block;margin:10px 0 6px;color:var(--mute);font-size:13px}
small.lb.ex{margin:-4px 0 12px;font-style:italic}
.actgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ac{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 3px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:700 12px Nunito,system-ui,sans-serif;text-align:center;cursor:pointer}
.ac .e{font-size:21px}
.ac small{font:500 9.5px Nunito,system-ui,sans-serif;color:var(--mute);line-height:1.15}
table.wk th,table.wk td{padding:5px 3px;font-size:13px}
table.wk td:first-child{font-size:16px;text-align:left}
table.wk td{color:var(--ok);font-weight:800}
table.wk td:last-child{color:var(--ink);font-weight:700}
.step{display:flex;align-items:center;gap:8px;padding:8px 2px;border-top:1px solid var(--line);cursor:pointer}
.step:first-of-type{border-top:none;margin-top:6px}
.step .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.step.done .ck{background:var(--ok);border-color:var(--ok);color:var(--accT)}
.step.done .t{text-decoration:line-through;color:var(--mute)}
.step .t{flex:1;min-width:0;font-size:14px}
.addstep{margin-top:8px;border:1.5px dashed var(--line);background:none;color:var(--acc);border-radius:10px;padding:7px 10px;font:700 13px Nunito,system-ui,sans-serif;cursor:pointer;width:100%}
.step .exp{flex-shrink:0;color:var(--mute);font-size:11px;padding:4px 6px}
.stepdetail{padding:6px 10px 10px 36px;margin-top:-4px;color:var(--mute);font-size:13px;word-break:break-word;overflow-wrap:anywhere}
.ln .editable{cursor:pointer;flex:1}
.ln.plan{padding:8px 2px;border-top:1px solid var(--line)}
.ln.plan:first-of-type{border-top:none}
.ln.plan span:last-child{color:var(--mute);font-size:13px;font-weight:700}
.ln.plan.done span:last-child{color:var(--ok)}
small.hint{display:block;margin-top:8px;color:var(--mute);font-size:12px}
button:focus-visible,input:focus-visible{outline:3px solid var(--tan);outline-offset:2px}
</style>
</head>
<body>
<div class="w">
<h1>Suivi de Boston</h1>
<div class="tabs"><button class="tab" data-tab="today">Aujourd'hui</button><button class="tab" data-tab="dressage">Dressage</button><button class="tab" data-tab="week">Semaine</button><button class="tab" data-tab="notes">Notes</button></div>
<div id="v"></div>
</div>
<div class="sh" id="sh"><div class="sc"><h2 id="st"></h2><div id="sb"></div><button class="ghost" id="sx">Annuler</button></div></div>
<script>
var K='chiot-v1',S={ev:[],notes:[],cmds:[],planDefault:{},planToday:{},journalOpen:false,journalFilter:'all',planOpen:true,dressFilter:'all'},tab='today';
try{var r=localStorage.getItem(K);if(r){var p=JSON.parse(r);if(p&&p.ev){S=p;if(!S.notes)S.notes=[];if(!S.cmds)S.cmds=[];if(!S.planDefault)S.planDefault={};if(!S.planToday)S.planToday={};if(S.journalOpen==null)S.journalOpen=false;if(!S.journalFilter)S.journalFilter='all';if(S.planOpen==null)S.planOpen=true;if(!S.dressFilter)S.dressFilter='all'}}}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var KINDS={balade:['🌿','Balade calme','à son rythme, il renifle'],jeu:['🎾',"Jeu d'interaction",'avec vous ou d\'autres chiens'],occup:['🧠','Jeu cérébral','fouille, Kong, recherche'],dressage:['🎓','Dressage','séance courte'],socia:['🐕','Socialisation','rencontres, bruits, lieux nouveaux'],decomp:['👅','Décompression','mâchouiller, lécher, renifler'],affect:['🤗','Lien affectif calme','câlins, présence sans sollicitation'],soins:['🖐️','Soins du corps','pattes, gueule, oreilles, brossage'],solo:['🚪','Habituation à la solitude','seul quelques minutes, sans stress']};
var AFTER={endormi:['😴','endormi'],calme:['🙂','calme'],agite:['😐','un peu agité'],surexcite:['⚡','surexcité']};
var QS={normales:'Selles normales',molles:'Selles molles',diarrhee:'Diarrhée'};
var MODE={seul:['👤','Seul'],duo:['👥','À deux'],groupe:['👨‍👩‍👧','À plusieurs']};
var $=function(s){return document.querySelector(s)};
function sod(t){var d=new Date(t);d.setHours(0,0,0,0);return +d}
function hm(t){return new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function ago(t){var m=Math.round((Date.now()-t)/6e4);if(m<1)return "à l'instant";if(m<60)return 'il y a '+m+' min';return 'il y a '+Math.floor(m/60)+' h '+('0'+m%60).slice(-2)}
function dayAgo(t){var d=Math.round((sod(Date.now())-sod(t))/864e5);return d<1?"aujourd'hui":d==1?'hier':'il y a '+d+' jours'}
function last(f){for(var i=S.ev.length-1;i>=0;i--)if(f(S.ev[i]))return S.ev[i]}
function open(){return last(function(e){return e.type==='sieste'})}
function lastMealBefore(ts){var m=null;S.ev.forEach(function(x){if(x.type==='repas'&&x.t<=ts&&(!m||x.t>m.t))m=x});return m}
function since(){var m=lastMealBefore(Date.now());return m?Math.round((Date.now()-m.t)/6e4):null}
function add(e){if(!e.t)e.t=Date.now();e.id=e.t+'-'+Math.random().toString(36).slice(2,6);if(e.type==='pipi'||e.type==='caca')recomputeDelay(e);S.ev.push(e);save();closeS();render()}
function timeField(id){return '<small class="lb">Heure</small><input type="datetime-local" id="'+(id||'evt')+'" value="'+toLocalInput(Date.now())+'">'}
function readTimeField(id){var v=$('#'+(id||'evt')).value,t=new Date(v).getTime();return isNaN(t)?Date.now():t}
function del(id){S.ev=S.ev.filter(function(e){return e.id!==id});save();render()}
function toLocalInput(t){var d=new Date(t),p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function recomputeDelay(e){if(e.type!=='pipi'&&e.type!=='caca')return;var m=lastMealBefore(e.t);if(m)e.d=Math.round((e.t-m.t)/6e4);else delete e.d}
function editEv(id){var e=S.ev.find(function(x){return x.id===id});if(!e)return;var l=lab(e);
 var h='<small class="lb">Heure</small><input type="datetime-local" id="et" value="'+toLocalInput(e.t)+'">';
 if(e.type==='sieste'&&e.end)h+='<small class="lb">Fin</small><input type="datetime-local" id="ete" value="'+toLocalInput(e.end)+'">';
 if(e.type==='act'){
  h+='<small class="lb">Durée en minutes</small><input type="number" id="edm" inputmode="numeric" min="0" value="'+(e.min||'')+'" placeholder="facultatif">';
  h+='<small class="lb">État après</small><div class="opts" id="edaf">';
  for(var a in AFTER)h+='<button class="opt'+(e.after===a?' on':'')+'" data-a="'+a+'"><span class="e">'+AFTER[a][0]+'</span>'+AFTER[a][1].charAt(0).toUpperCase()+AFTER[a][1].slice(1)+'</button>';
  h+='</div>'}
 h+='<div class="opts"><button class="opt go" id="esave">Enregistrer</button></div>';
 openS(l[0]+' '+l[1],h);
 var chosenAfter=e.after;
 if(e.type==='act'){[].forEach.call(document.querySelectorAll('#edaf .opt'),function(b){b.onclick=function(){chosenAfter=b.dataset.a;[].forEach.call(document.querySelectorAll('#edaf .opt'),function(x){x.classList.toggle('on',x===b)})}})}
 $('#esave').onclick=function(){var nt=new Date($('#et').value).getTime();if(!isNaN(nt))e.t=nt;if($('#ete')){var ne=new Date($('#ete').value).getTime();if(!isNaN(ne))e.end=ne}
  if(e.type==='act'){var m=+$('#edm').value;e.min=m>0?Math.round(m):null;if(chosenAfter)e.after=chosenAfter}
  recomputeDelay(e);S.ev.forEach(recomputeDelay);save();closeS();render()}}
function openS(t,h){$('#st').textContent=t;$('#sb').innerHTML=h;$('#sh').classList.add('open')}
function closeS(){$('#sh').classList.remove('open')}
$('#sx').onclick=closeS;
function hmFmt(m){if(m==null)return '';m=Math.round(m);if(m<60)return m+' min';var h=Math.floor(m/60),mm=m%60;return h+'h'+(mm?('0'+mm).slice(-2):'')}
function dl(e){return e.d!=null?' · '+hmFmt(e.d)+' après le repas':''}
function lab(e){
 if(e.type==='repas')return ['🍽️','Repas · '+e.g+' g'];
 if(e.type==='pipi')return ['💧','Pipi'+dl(e)];
 if(e.type==='caca')return ['💩',QS[e.q]+dl(e)];
 if(e.type==='sieste'){var d=e.end?' · '+hmFmt(Math.max(1,Math.round((e.end-e.t)/6e4))):' en cours';return ['😴','Sieste'+d]}
 var k=KINDS[e.kind];return [k[0],k[1]+(e.also?' + '+e.also.map(function(q){return KINDS[q][1]}).join(' + '):'')+(e.min?' · '+hmFmt(e.min):'')+(e.after?' · '+AFTER[e.after][1]:'')]}
function repas(){
 var l=last(function(e){return e.type==='repas'});
 openS('Repas','<input type="number" id="g" inputmode="numeric" min="0" placeholder="'+(l?'dernière fois : '+l.g+' g':'grammes')+'" autofocus>'+timeField()+'<div class="opts"><button class="opt go" id="ok">Enregistrer (grammes)</button></div>');
 $('#g').focus();
 $('#ok').onclick=function(){add({type:'repas',g:+$('#g').value||0,t:readTimeField()})}}
function pc(){
 var h='<small class="lb">Pipi</small><div class="opts" id="pcpipi"><button class="opt" data-a="pipi"><span class="e">💧</span>Pipi</button></div>';
 h+='<small class="lb">Caca</small><div class="opts" id="pcopt">';
 for(var q in QS)h+='<button class="opt" data-a="'+q+'"><span class="e">💩</span>'+QS[q]+'</button>';
 h+='</div>'+timeField()+'<div class="opts"><button class="opt go" id="pcok">Enregistrer</button></div>';
 openS('Pipi / caca',h);
 var pipiOn=false,cacaQ=null;
 var pb=$('#pcpipi .opt');pb.onclick=function(){pipiOn=!pipiOn;pb.classList.toggle('on',pipiOn)};
 [].forEach.call(document.querySelectorAll('#pcopt .opt'),function(b){b.onclick=function(){cacaQ=(cacaQ===b.dataset.a)?null:b.dataset.a;[].forEach.call(document.querySelectorAll('#pcopt .opt'),function(x){x.classList.toggle('on',x.dataset.a===cacaQ)})}});
 $('#pcok').onclick=function(){if(!pipiOn&&!cacaQ)return;var t=readTimeField();if(pipiOn)add({type:'pipi',t:t});if(cacaQ)add({type:'caca',q:cacaQ,t:t})}}
function sieste(){
 var o=open();
 if(o&&!o.end){
  openS('Fin de la sieste',timeField()+'<div class="opts"><button class="opt go" id="sok">Terminer la sieste</button></div>');
  $('#sok').onclick=function(){var t=readTimeField();o.end=t<o.t?o.t:t;save();closeS();render()};
  return}
 openS('Début de la sieste',timeField()+'<div class="opts"><button class="opt go" id="sok">Commencer la sieste</button></div>');
 $('#sok').onclick=function(){add({type:'sieste',t:readTimeField()})}}
function act(){
 var h='<div class="actgrid">';
 for(var k in KINDS)h+='<button class="ac" data-k="'+k+'"><span class="e">'+KINDS[k][0]+'</span><span>'+KINDS[k][1]+'</span><small>'+KINDS[k][2]+'</small></button>';
 openS('Quelle activité ?',h+'</div>');
 [].forEach.call(document.querySelectorAll('#sb .ac'),function(b){b.onclick=function(){after(b.dataset.k)}})}
function topCalming(excludeK){
 var best=null;
 for(var q in KINDS){if(q===excludeK)continue;var a=S.ev.filter(function(e){return has(e,q)&&e.after&&(e.after==='calme'||e.after==='endormi'||e.after==='agite'||e.after==='surexcite')});if(!a.length)continue;
  var c={calme:0,endormi:0,agite:0,surexcite:0};a.forEach(function(e){c[e.after]++});var p=(c.calme+c.endormi)/a.length;
  if(!best||p>best.p||(p===best.p&&a.length>best.n))best={k:q,p:p,n:a.length}}
 return best}
function suggestCalm(k){
 var b=topCalming(k),msg;
 if(b&&b.n>=2)msg="D'après tes notes, ce qui l'apaise le mieux, c'est <b>"+KINDS[b.k][0]+' '+KINDS[b.k][1]+'</b> ('+Math.round(b.p*100)+"% calme ou endormi après). Tu peux essayer ça pour l'aider à redescendre.";
 else msg="Pas encore assez de données pour te proposer une activité précise. En général, mâchouiller ou lécher, dans un endroit calme et sans sollicitation, aide à redescendre — tant qu'il est haut en intensité, il ne se posera pas seul.";
 openS("Pour l'aider à redescendre",msg+'<div class="opts" style="margin-top:12px"><button class="opt go" id="okc">OK</button></div>');
 $('#okc').onclick=closeS}
function after(k){
 var h='<small class="lb ex">'+KINDS[k][2]+'</small>';
 h+='<input type="number" id="dm" class="dmin" inputmode="numeric" min="0" placeholder="Durée (min)">';
 h+='<small class="lb">État après (facultatif)</small><div class="opts" id="afst">';
 for(var a in AFTER)h+='<button class="opt" data-a="'+a+'"><span class="e">'+AFTER[a][0]+'</span>'+AFTER[a][1].charAt(0).toUpperCase()+AFTER[a][1].slice(1)+'</button>';
 h+='</div><div id="alwrap"><button class="addmore" onclick="document.getElementById(\'alwrap\').innerHTML=alsoHtml(\''+k+'\');[].forEach.call(document.querySelectorAll(\'#al .chp\'),function(c){c.onclick=function(){c.classList.toggle(\'on\')}})">+ Compte aussi comme…</button></div>';
 h+=timeField()+'<div class="opts"><button class="opt go" id="aok">Enregistrer</button></div>';
 openS(KINDS[k][0]+' '+KINDS[k][1],h);
 var chosen=null;
 [].forEach.call(document.querySelectorAll('#afst .opt'),function(b){b.onclick=function(){chosen=(chosen===b.dataset.a)?null:b.dataset.a;[].forEach.call(document.querySelectorAll('#afst .opt'),function(x){x.classList.toggle('on',x.dataset.a===chosen)})}});
 $('#aok').onclick=function(){var e={type:'act',kind:k,t:readTimeField()};if(chosen)e.after=chosen;var m=+$('#dm').value;if(m>0)e.min=Math.round(m);var alEl=document.querySelectorAll('#al .chp.on');var al=[].map.call(alEl,function(c){return c.dataset.k});if(al.length)e.also=al;add(e);if(chosen==='agite'||chosen==='surexcite')setTimeout(function(){suggestCalm(k)},50)}}
function souci(){var n=S.ev.filter(function(e){return e.type==='caca'&&e.q!=='normales'&&e.t>Date.now()-864e5}).length;return n>=2?'<div class="warn">⚠️ '+n+' selles molles ou liquides ces dernières 24 h</div>':''}
function totalToday(){var m=S.ev.filter(function(e){return e.type==='repas'&&sod(e.t)===sod(Date.now())});if(!m.length)return '';return '<div class="ap">🍽️ '+m.reduce(function(s,e){return s+e.g},0)+' g en '+m.length+' repas</div>'}
function wd(d){return new Date(d).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'})}
var DEFAULT_TARGETS={balade:{n:1,min:25},jeu:{n:2,min:null},occup:{n:1,min:null},dressage:{n:3,min:9},socia:{n:1,min:null},decomp:{n:1,min:null},affect:{n:1,min:null},soins:{n:1,min:null},solo:{n:1,min:null}};
function todayKey(){return new Date().toISOString().slice(0,10)}
function getTarget(k){var d=todayKey();return (S.planToday[d]&&S.planToday[d][k])||S.planDefault[k]||DEFAULT_TARGETS[k]}
function setTarget(k,n,min,always){if(always){S.planDefault[k]={n:n,min:min}}else{var d=todayKey();if(!S.planToday[d])S.planToday[d]={};S.planToday[d][k]={n:n,min:min}}save()}
function editTarget(k){var t=getTarget(k);
 openS(KINDS[k][0]+' '+KINDS[k][1],'<small class="lb">Nombre de fois visé aujourd\'hui</small><input type="number" id="pn" inputmode="numeric" min="0" value="'+t.n+'"><small class="lb">Durée visée en minutes (facultatif)</small><input type="number" id="pm" inputmode="numeric" min="0" value="'+(t.min||'')+'"><div class="opts"><button class="opt go" id="pok1">Enregistrer pour aujourd\'hui</button><button class="opt" id="pok2">Enregistrer comme objectif par défaut</button></div>');
 $('#pok1').onclick=function(){setTarget(k,+$('#pn').value||0,+$('#pm').value||null,false);closeS();render()};
 $('#pok2').onclick=function(){setTarget(k,+$('#pn').value||0,+$('#pm').value||null,true);closeS();render()}}
function planToday(){var t=sod(Date.now()),rows='',done=0,total=0;
 for(var k in KINDS){var tg=getTarget(k),c=S.ev.filter(function(e){return has(e,k)&&sod(e.t)===t}),n=c.length,mn=c.reduce(function(s,e){return s+(e.min||0)},0),ok=n>=tg.n&&(!tg.min||mn>=tg.min);
  total++;if(ok)done++;
  rows+='<div class="ln plan'+(ok?' done':'')+'"><span>'+KINDS[k][0]+' '+KINDS[k][1]+'</span><span>'+n+'/'+tg.n+(tg.min?' · '+hmFmt(mn)+'/'+hmFmt(tg.min):'')+(ok?' ✓':'')+'</span></div>'}
 var h='<h2>Plan du jour<span class="hdrbtns"><span class="gear" onclick="togglePlan()">'+(S.planOpen?'▲':'▼')+' '+done+'/'+total+' atteints</span><span class="gear" onclick="allTargets()">⚙️</span></span></h2>';
 if(S.planOpen)h+='<div class="ap">'+rows+'</div>';
 return h}
function togglePlan(){S.planOpen=!S.planOpen;save();render()}
function allTargets(){
 var h='<small class="hint" style="display:block;margin:-6px 0 12px">Ces objectifs s\'appliquent tous les jours par défaut. Pratique à revoir au fil de sa croissance.</small>';
 for(var k in KINDS){var tg=S.planDefault[k]||DEFAULT_TARGETS[k];
  h+='<div class="row" style="align-items:center;flex-wrap:wrap"><span class="e">'+KINDS[k][0]+'</span><div class="t" style="min-width:110px">'+KINDS[k][1]+'</div>'
  +'<input type="number" id="an-'+k+'" inputmode="numeric" min="0" value="'+tg.n+'" style="width:56px;margin:0;padding:8px" title="fois/jour">'
  +'<input type="number" id="am-'+k+'" inputmode="numeric" min="0" value="'+(tg.min||'')+'" placeholder="min" style="width:64px;margin:0;padding:8px" title="minutes cumulées"></div>'}
 h+='<div class="opts"><button class="opt go" id="atok">Enregistrer ces objectifs par défaut</button></div>';
 openS('Régler les objectifs',h);
 $('#atok').onclick=function(){for(var k in KINDS)S.planDefault[k]={n:+$('#an-'+k).value||0,min:+$('#am-'+k).value||null};save();closeS();render()}}
function has(e,k){return e.type==='act'&&(e.kind===k||(e.also||[]).indexOf(k)>-1)}
function sommeilToday(){var t=sod(Date.now()),n=S.ev.filter(function(e){return e.type==='sieste'&&sod(e.t)===t});if(!n.length)return '';var m=Math.round(n.reduce(function(s,e){return s+((e.end||Date.now())-e.t)},0)/6e4);return '<div class="ap">😴 '+Math.floor(m/60)+' h '+('0'+m%60).slice(-2)+' de sieste aujourd\'hui</div>'}
function alsoHtml(k){var h='<small class="lb">Compte aussi comme (facultatif)</small><div class="chipsgrid" id="al">';for(var q in KINDS)if(q!==k)h+='<button class="chp" data-k="'+q+'"><span class="e">'+KINDS[q][0]+'</span>'+KINDS[q][1]+'</button>';return h+'</div>'}
function today(){
 var o=open(),live=o&&!o.end,lm=last(function(e){return e.type==='repas'}),lp=last(function(e){return e.type==='pipi'||e.type==='caca'}),la=last(function(e){return e.type==='act'});
 var h='<div class="grid">'
 +'<button class="big" onclick="repas()"><span class="e">🍽️</span><span class="tx">Repas<small>'+(lm?ago(lm.t):'pas encore')+'</small></span></button>'
 +'<button class="big" onclick="pc()"><span class="e">💧</span><span class="tx">Pipi / caca<small>'+(lp?ago(lp.t):'pas encore')+'</small></span></button>'
 +'<button class="big'+(live?' live':'')+'" onclick="sieste()"><span class="e">😴</span><span class="tx">'+(live?'Il se réveille':'Il dort')+'<small>'+(live?'endormi depuis '+hm(o.t):o?'dernière '+ago(o.end||o.t):'pas encore')+'</small></span></button>'
 +'<button class="big" onclick="act()"><span class="e">🎾</span><span class="tx">Activité<small>'+(la?ago(la.t):'pas encore')+'</small></span></button></div>';
 h+=planToday()+sommeilToday()+totalToday()+souci();
 h+='<h2>Aujourd\'hui <span class="gear" onclick="toggleJournal()">'+(S.journalOpen?'▲ masquer':'▼ afficher')+'</span></h2>';
 if(S.journalOpen){
  h+='<div class="fchips">';
  JFILTERS.forEach(function(f){h+='<button class="fchip'+(S.journalFilter===f[0]?' on':'')+'" onclick="setJournalFilter(\''+f[0]+'\')">'+f[2]+' '+f[1]+'</button>'});
  h+='</div>';
  var ev=S.ev.filter(function(e){return sod(e.t)===sod(Date.now())&&matchesFilter(e,S.journalFilter)}).sort(function(a,b){return b.t-a.t});
  if(!ev.length)h+='<div class="empty">'+(S.journalFilter==='all'?"Rien de noté pour l'instant. Appuie sur un bouton quand il se passe quelque chose.":'Rien dans ce filtre pour aujourd\'hui.')+'</div>';
  ev.forEach(function(e){var l=lab(e);h+='<div class="row ev-row" onclick="editEv(\''+e.id+'\')"><span class="e">'+l[0]+'</span><div class="t">'+l[1]+'<div class="h">'+hm(e.t)+'</div></div><button class="x" aria-label="Supprimer" onclick="event.stopPropagation();del(\''+e.id+'\')">×</button></div>'})}
 return h}
var JFILTERS=[['all','Tout','📋'],['repas','Repas','🍽️'],['pipi','Pipi','💧'],['caca','Caca','💩'],['sieste','Sieste','😴'],['act','Activités','🎯']];
function matchesFilter(e,f){if(f==='all')return true;if(f==='act')return e.type==='act';return e.type===f}
function toggleJournal(){S.journalOpen=!S.journalOpen;save();render()}
function setJournalFilter(f){S.journalFilter=f;save();render()}

function ord(n){return n===1?'1er':n+'e'}
function transitRanks(){var meals=S.ev.filter(function(e){return e.type==='repas'}).sort(function(a,b){return a.t-b.t}),ranks=[];
 meals.forEach(function(m,i){var next=meals[i+1]?meals[i+1].t:Infinity;
  var cacas=S.ev.filter(function(e){return e.type==='caca'&&e.t>m.t&&e.t<next}).sort(function(a,b){return a.t-b.t});
  cacas.forEach(function(c,idx){var mins=Math.round((c.t-m.t)/6e4);if(!ranks[idx])ranks[idx]=[];ranks[idx].push(mins)})});
 return ranks}
function week(){
 var now=sod(Date.now()),days=[];for(var i=6;i>=0;i--)days.push(now-i*864e5);
 var ev=S.ev.filter(function(e){return e.t>=days[0]});
 function on(e,d){return sod(e.t)===d}
 var h='<h2>Activités, 7 derniers jours</h2><div class="ap"><table class="wk"><tr><th></th>';
 days.forEach(function(d){h+='<th>'+new Date(d).toLocaleDateString('fr-FR',{weekday:'narrow'})+'</th>'});
 h+='<th>Σ</th></tr>';
 for(var k in KINDS){var a=ev.filter(function(e){return has(e,k)});
  h+='<tr><td>'+KINDS[k][0]+'</td>';
  days.forEach(function(d){h+='<td>'+(a.some(function(e){return on(e,d)})?'●':'')+'</td>'});
  h+='<td>'+a.length+'</td></tr>'}
 h+='</table><small>'+Object.keys(KINDS).map(function(k){return KINDS[k][0]+' '+KINDS[k][1]}).join(' · ')+'</small></div>';
 var DT=[];
 for(var k3 in KINDS){var a3=ev.filter(function(e){return has(e,k3)&&e.min});if(!a3.length)continue;
  var nd3=days.filter(function(d){return a3.some(function(e){return on(e,d)})}).length,tot3=a3.reduce(function(s,e){return s+e.min},0);
  DT.push({e:KINDS[k3][0],n:KINDS[k3][1],avg:Math.round(tot3/nd3),nd:nd3})}
 if(DT.length){h+='<h2>Durée moyenne par jour</h2><div class="ap">';
  DT.forEach(function(r){h+='<div class="ln"><span>'+r.e+' '+r.n+'</span><span>'+hmFmt(r.avg)+'</span></div>'});
  h+='<small>Moyenne sur les jours où la durée a été renseignée</small></div>'}
 var sl=ev.filter(function(e){return e.type==='sieste'&&e.end}),tot=sl.reduce(function(s,e){return s+(e.end-e.t)},0)/6e4,nsl=days.filter(function(d){return sl.some(function(e){return on(e,d)})}).length,avg=nsl?Math.round(tot/nsl):0;
 h+='<h2>Repos</h2><div class="ap">'+(nsl?'😴 '+Math.floor(avg/60)+' h '+('0'+avg%60).slice(-2)+' par jour en moyenne<small>siestes de la journée, sur '+nsl+' jour'+(nsl>1?'s':'')+' renseigné'+(nsl>1?'s':'')+'</small>':'Pas encore de sieste notée<small>Les siestes de la journée seront moyennées ici</small>')+'</div>';
 var rows='',tg=0,nm=0;
 days.forEach(function(d){var m=ev.filter(function(e){return e.type==='repas'&&on(e,d)}),g=m.reduce(function(s,e){return s+e.g},0);tg+=g;if(m.length)nm++;
  rows+='<div class="ln"><span>'+wd(d)+'</span><span>'+(m.length?g+' g · '+m.length+' repas':'–')+'</span></div>'});
 h+='<h2>Croquettes</h2><div class="ap"><div class="ln"><b>Moyenne</b><b>'+(nm?Math.round(tg/nm):0)+' g par jour</b></div><small>total '+tg+' g · moyenne sur '+nm+' jour'+(nm>1?'s':'')+' renseigné'+(nm>1?'s':'')+'</small><div class="tb">'+rows+'</div></div>';
 var sr='';
 days.forEach(function(d){var c=ev.filter(function(e){return e.type==='caca'&&on(e,d)});
  sr+='<div class="ln"><span>'+wd(d)+'</span><span>'+(c.length?c.map(function(e){return e.q==='normales'?'🟢':e.q==='molles'?'🟠':'🔴'}).join(' '):'–')+'</span></div>'});
 var ranks=transitRanks(),MIN_R=3,MAXR=4,rankLines='',anyRank=false;
 for(var ri=0;ri<Math.min(ranks.length,MAXR);ri++){var arr=ranks[ri]||[];if(arr.length>=MIN_R){anyRank=true;var avg=Math.round(arr.reduce(function(s,v){return s+v},0)/arr.length);rankLines+='<div class="ln"><span>💩 '+ord(ri+1)+' caca après repas</span><span>'+hmFmt(avg)+' en moyenne ('+arr.length+')</span></div>'}}
 if(anyRank){h+='<h2>Repères après le repas</h2><div class="ap">'+rankLines;
  h+='<small>Moyenne par position dans l\'ordre où tu notes les cacas après chaque repas (1er, 2e, 3e…), depuis le début du suivi. Si un caca est oublié, les suivants du même repas remontent d\'un rang.</small></div>'}
 h+='<h2>Selles</h2>'+souci()+'<div class="ap"><small>🟢 normales · 🟠 molles · 🔴 diarrhée</small><div class="tb">'+sr+'</div></div>';
 h+='<h2>Ce qui l\'apaise</h2>';
 var T=[];
 for(var k2 in KINDS){var a2=S.ev.filter(function(e){return has(e,k2)&&e.after});if(!a2.length)continue;
  var c2={calme:0,endormi:0,agite:0,surexcite:0};a2.forEach(function(e){c2[e.after]++});
  T.push({e:KINDS[k2][0],n:KINDS[k2][1],t:a2.length,c:c2,p:(c2.calme+c2.endormi)/a2.length})}
 T.sort(function(x,y){return y.p-x.p||y.t-x.t});
 if(!T.length)h+='<div class="empty">Note son état après chaque activité : ça apparaîtra ici.</div>';
 else{h+='<div class="ap"><table><tr><th>Activité</th><th>Fois</th><th>🙂</th><th>😴</th><th>😐</th><th>⚡</th></tr>';
  T.forEach(function(r){h+='<tr><td>'+r.e+' '+r.n+'</td><td>'+r.t+'</td><td>'+r.c.calme+'</td><td>'+r.c.endormi+'</td><td>'+r.c.agite+'</td><td>'+r.c.surexcite+'</td></tr>'});
  h+='</table><small>Du plus au moins apaisant (🙂 + 😴)</small></div>'}
 h+='<div class="note">Les données restent dans ce navigateur, sur ce téléphone.</div>';
 return h}
function addNote(){
 openS('Nouvelle note','<small class="lb">Thème</small><input type="text" id="nt" list="th" placeholder="Dressage, Santé, Alimentation…"><datalist id="th">'+themes().map(function(t){return '<option value="'+t+'">'}).join('')+'</datalist><small class="lb">Note</small><textarea id="nx" placeholder="Ce que tu veux garder en tête…" rows="4"></textarea><div class="opts"><button class="opt go" id="nok">Enregistrer</button></div>');
 $('#nok').onclick=function(){var th=$('#nt').value.trim()||'Général',tx=$('#nx').value.trim();if(!tx)return;S.notes.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),t:Date.now(),theme:th,text:tx});save();closeS();render()}}
function themes(){var s=[];S.notes.forEach(function(n){if(s.indexOf(n.theme)<0)s.push(n.theme)});return s.sort()}
function delNote(id){S.notes=S.notes.filter(function(n){return n.id!==id});save();render()}
function editNote(id){var n=S.notes.find(function(x){return x.id===id});if(!n)return;
 openS('Modifier la note','<small class="lb">Thème</small><input type="text" id="nt" list="th" value="'+n.theme.replace(/"/g,'&quot;')+'"><datalist id="th">'+themes().map(function(t){return '<option value="'+t+'">'}).join('')+'</datalist><small class="lb">Note</small><textarea id="nx" rows="5">'+n.text.replace(/</g,'&lt;')+'</textarea><div class="opts"><button class="opt go" id="nok">Enregistrer</button></div>');
 $('#nok').onclick=function(){var th=$('#nt').value.trim()||'Général',tx=$('#nx').value.trim();if(!tx)return;n.theme=th;n.text=tx;save();closeS();render()}}
function notesView(){
 var h='<button class="opt go" style="width:100%;margin-bottom:16px" onclick="addNote()">+ Ajouter une note</button>';
 if(!S.notes.length)return h+'<div class="empty">Rien de noté pour l\'instant. Astuces de dressage, points de vigilance, ce que dit le véto… tout peut aller ici, classé par thème.</div>';
 themes().forEach(function(th){h+='<h2>'+th+'</h2>';
  S.notes.filter(function(n){return n.theme===th}).sort(function(a,b){return b.t-a.t}).forEach(function(n){
   h+='<div class="row ev-row" style="align-items:flex-start" onclick="editNote(\''+n.id+'\')"><div class="t">'+n.text.replace(/</g,'&lt;').replace(/\n/g,'<br>')+'<div class="h">'+new Date(n.t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+'</div></div><button class="x" aria-label="Supprimer" onclick="event.stopPropagation();delNote(\''+n.id+'\')">×</button></div>'})});
 return h}
function addCmd(){
 openS('Nouvel ordre','<small class="lb">Nom</small><input type="text" id="cn" placeholder="Assis, Couché, Rappel…"><div class="opts"><button class="opt go" id="cok">Créer</button></div>');
 $('#cok').onclick=function(){var n=$('#cn').value.trim();if(!n)return;S.cmds.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),name:n,steps:[]});save();closeS();render()}}
function modeChips(sel,id){var h='<small class="lb">Seul ou accompagné (facultatif)</small><div class="opts" id="'+id+'">';for(var m in MODE)h+='<button class="opt'+(sel===m?' on':'')+'" data-m="'+m+'"><span class="e">'+MODE[m][0]+'</span>'+MODE[m][1]+'</button>';return h+'</div>'}
function wireModeChips(id,getSel,setSel){[].forEach.call(document.querySelectorAll('#'+id+' .opt'),function(b){b.onclick=function(){var cur=getSel();var nv=(cur===b.dataset.m)?null:b.dataset.m;setSel(nv);[].forEach.call(document.querySelectorAll('#'+id+' .opt'),function(x){x.classList.toggle('on',x.dataset.m===nv)})}})}
function addStep(cid){
 openS('Nouvelle étape','<small class="lb">Ce qu\'il doit réussir à cette étape (facultatif)</small><textarea id="sx" placeholder="Ex. Avec friandise devant son nez" rows="3"></textarea>'+modeChips(null,'smode')+'<div class="opts"><button class="opt go" id="sok">Ajouter</button></div>');
 var mode=null;wireModeChips('smode',function(){return mode},function(v){mode=v});
 $('#sok').onclick=function(){var t=$('#sx').value.trim();var c=S.cmds.filter(function(c){return c.id===cid})[0];c.steps.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),text:t,mode:mode,done:false});save();closeS();render()}}
function toggleStep(cid,sid){var c=S.cmds.filter(function(c){return c.id===cid})[0],s=c.steps.filter(function(s){return s.id===sid})[0];s.done=!s.done;save();render()}
function delCmd(cid){S.cmds=S.cmds.filter(function(c){return c.id!==cid});save();render()}
function delStep(cid,sid,ev){ev.stopPropagation();var c=S.cmds.filter(function(c){return c.id===cid})[0];c.steps=c.steps.filter(function(s){return s.id!==sid});save();render()}
var expSteps={};
function toggleStepDetail(sid,evt){evt.stopPropagation();expSteps[sid]=!expSteps[sid];render()}
function editCmdName(cid){var c=S.cmds.find(function(x){return x.id===cid});if(!c)return;
 openS('Renommer l\'ordre','<small class="lb">Nom</small><input type="text" id="cn2" value="'+c.name.replace(/"/g,'&quot;')+'"><div class="opts"><button class="opt go" id="cnok">Enregistrer</button></div>');
 $('#cnok').onclick=function(){var n=$('#cn2').value.trim();if(!n)return;c.name=n;save();closeS();render()}}
function editStep(cid,sid,evt){if(evt)evt.stopPropagation();var c=S.cmds.find(function(x){return x.id===cid});if(!c)return;var s=c.steps.find(function(x){return x.id===sid});if(!s)return;
 openS('Modifier l\'étape','<small class="lb">Ce qu\'il doit réussir à cette étape (facultatif)</small><textarea id="sx2" rows="4">'+(s.text||'').replace(/</g,'&lt;')+'</textarea>'+modeChips(s.mode,'smode2')+'<div class="opts"><button class="opt go" id="sxok">Enregistrer</button></div>');
 var mode=s.mode||null;wireModeChips('smode2',function(){return mode},function(v){mode=v});
 $('#sxok').onclick=function(){s.text=$('#sx2').value.trim();s.mode=mode;save();closeS();render()}}
function setDressFilter(f){S.dressFilter=f;save();render()}
function dressageView(){
 var h='<button class="opt go" style="width:100%;margin-bottom:16px" onclick="addCmd()">+ Nouvel ordre</button>';
 if(!S.cmds.length)return h+'<div class="empty">Ajoute les ordres que tu veux lui apprendre (assis, couché, rappel…) et découpe-les en étapes à valider une à une. Travaille un seul ordre par séance tant qu\'il n\'est pas fixé.</div>';
 h+='<div class="fchips"><button class="fchip'+(S.dressFilter==='all'?' on':'')+'" onclick="setDressFilter(\'all\')">📋 Tout</button>';
 for(var m in MODE)h+='<button class="fchip'+(S.dressFilter===m?' on':'')+'" onclick="setDressFilter(\''+m+'\')">'+MODE[m][0]+' '+MODE[m][1]+'</button>';
 h+='</div>';
 S.cmds.forEach(function(c){
  var done=c.steps.filter(function(s){return s.done}).length,tot=c.steps.length;
  var steps=S.dressFilter==='all'?c.steps:c.steps.filter(function(s){return s.mode===S.dressFilter});
  if(S.dressFilter!=='all'&&!steps.length)return;
  h+='<div class="ap"><div class="ln"><b class="editable" onclick="editCmdName(\''+c.id+'\')">'+c.name+'</b><button class="x" onclick="delCmd(\''+c.id+'\')">×</button></div>';
  h+='<small>'+(tot?done+'/'+tot+' étapes validées'+(done===tot?' · maîtrisé ✅':''):'aucune étape pour l\'instant')+'</small>';
  steps.forEach(function(s){var idx=c.steps.indexOf(s),exp=!!expSteps[s.id];
   h+='<div class="step'+(s.done?' done':'')+'" onclick="toggleStep(\''+c.id+'\',\''+s.id+'\')"><span class="ck">'+(s.done?'✓':'')+'</span><span class="t">Étape '+(idx+1)+(s.mode?' '+MODE[s.mode][0]:'')+'</span><span class="exp" onclick="toggleStepDetail(\''+s.id+'\',event)">'+(exp?'▲':'▼')+'</span><span class="exp" onclick="editStep(\''+c.id+'\',\''+s.id+'\',event)">✎</span><button class="x" onclick="delStep(\''+c.id+'\',\''+s.id+'\',event)">×</button></div>';
   if(exp)h+='<div class="stepdetail">'+(s.text?s.text.replace(/</g,'&lt;').replace(/\n/g,'<br>'):'<i>Pas de détail noté</i>')+'</div>'});
  h+='<button class="addstep" onclick="addStep(\''+c.id+'\')">+ étape</button></div>'});
 return h}
function render(){
 [].forEach.call(document.querySelectorAll('.tab'),function(b){b.classList.toggle('on',b.dataset.tab===tab)});
 $('#v').innerHTML=tab==='today'?today():tab==='week'?week():tab==='notes'?notesView():dressageView()}
[].forEach.call(document.querySelectorAll('.tab'),function(b){b.onclick=function(){tab=b.dataset.tab;render()}});
render();
</script>
</body>
</html>
